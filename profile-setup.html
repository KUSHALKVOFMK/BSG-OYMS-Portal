<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b287d"><title>Patrol Leader Profile Setup | KVS-OYMS 2.0"><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page">
<header class="auth-top"><div class="brandtext school-brand"><strong>KVS-OYMS 2.0 · SANKALP</strong><span>Patrol Leader first-login profile setup</span></div></header>
<main class="auth-main"><section class="auth-card"><p class="role-kicker">FIRST LOGIN · PROFILE SETUP</p><h1>Complete Your Patrol Leader Profile</h1><p class="sub">Complete these details once before opening your Patrol Leader dashboard. Use a clear photograph in the correct BSG uniform.</p><div id="profileMessage" class="auth-message" role="alert"></div>
<form id="profileSetupForm"><div class="auth-field"><label for="plName">Full Name</label><input id="plName" maxlength="100" required></div><div class="auth-field"><label for="plDob">Date of Birth</label><input id="plDob" type="date" required></div><div class="auth-field"><label for="plGender">Gender</label><select id="plGender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Prefer not to say</option></select></div><div class="auth-field"><label for="plBlood">Blood Group</label><select id="plBlood" required><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option><option>Unknown</option></select></div><div class="auth-field"><label for="plMobileSetup">Contact Number</label><input id="plMobileSetup" inputmode="tel" maxlength="20"></div><div class="auth-field"><label for="plAddress">Residential Address</label><textarea id="plAddress" rows="3" maxlength="500" required></textarea></div><div class="auth-field"><label for="plPhoto">Profile Photograph</label><input id="plPhoto" type="file" accept="image/jpeg,image/png,image/webp" required><small class="field-help">JPG, PNG or WebP · maximum 5 MB · clear photograph in BSG uniform.</small></div><button class="auth-btn" type="submit">Save Profile &amp; Continue</button></form>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="profile-setup.js"></script></body></html>
