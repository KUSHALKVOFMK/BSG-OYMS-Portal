<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b287d"><title>Set Your Password | KVS-OYMS 2.0"><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page">
<header class="auth-top"><div class="brandtext school-brand"><strong>KVS-OYMS 2.0 · SANKALP</strong><span>Secure first sign-in</span></div></header>
<main class="auth-main"><section class="auth-card"><p class="role-kicker">ACCOUNT SECURITY</p><h1>Set Your Own Password</h1><p class="sub">This is required for your first sign-in. Choose a private password and do not share it.</p><div id="changeMessage" class="auth-message" role="alert"></div>
<form id="changePasswordForm"><div class="auth-field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></div><div class="auth-field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div><button class="auth-btn" type="submit">Save New Password</button></form>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="change-password.js"></script></body></html>
