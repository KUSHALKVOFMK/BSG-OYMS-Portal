<text x="480" y="278" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#163d6a">AWARENESS  •  PREVENTION  •  SUPPORT</text>
<text x="480" y="342" font-family="Arial,sans-serif" font-size="29" fill="#243f5f">End stigma. Share knowledge.</text><text x="480" y="385" font-family="Arial,sans-serif" font-size="29" fill="#243f5f">Stand with people living with HIV.</text>
